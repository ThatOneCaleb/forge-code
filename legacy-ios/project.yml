name: ForgeCode
options:
  bundleIdPrefix: com.forgecode
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ForgeCodeEngine:
    path: .

targets:
  ForgeCode:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Resources/RoboticsHeroModels
        type: folder
        buildPhase: resources
      - path: Resources/GameArt
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgecode.app
        PRODUCT_NAME: ForgeCode
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: XA6CT62Z2N
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: ForgeCodeEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleName: "Forge Code"
        CFBundleDisplayName: "Forge Code"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Forge Code uses your photo library to let you add photos to your Build Log entries."

  ForgeCodeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgecode.app.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ForgeCode
      - package: ForgeCodeEngine

  ForgeCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgecode.app.uitests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: ForgeCode
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ForgeCode
